function startReviewSession(){
  const now=Date.now();
  /* صارم: فقط الأفعال التي حان موعدها الآن أو قبله */
  const pool=verbsEligibleForReview()
    .filter(v=>getVp(v.it).nextReview<=now)
    .sort((a,b)=>{
      const va=getVp(a.it),vb=getVp(b.it);
      const sa=(va.memoryStrength<50?50:0)-va.memoryStrength;
      const sb=(vb.memoryStrength<50?50:0)-vb.memoryStrength;
      return sb-sa;
    });
  if(pool.length===0){alert('لا توجد أفعال مستحقة للمراجعة الآن! 🎉');return;}
  const queue=[];
  pool.slice(0,5).forEach((verb,i)=>buildReviewItems(verb,i).forEach(it=>queue.push(it)));
  session={sessionIndex:-1,verb:pool[0],queue,idx:0,stageDone:{},isReviewOnly:true};
  sessionStats={correct:0,wrong:0,improved:[],famChanges:{}};
  showScreen('session');
  renderQuestion();
}

/* ═══════════════════════════════════════ REVIEW SCHEDULE SCREEN ══════════════════════════ */
const REVIEW_TABS=[
  {label:'اليوم',key:'today',days:0},
  {label:'غداً',key:'tomorrow',days:1},
  {label:'3 أيام',key:'d3',days:3},
  {label:'7 أيام',key:'d7',days:7},
  {label:'14 يوم',key:'d14',days:14},
  {label:'30 يوم',key:'d30',days:30},
];

function getReviewBucket(vp){
  const now=Date.now();
  const diff=vp.nextReview-now; /* ms */
  if(diff<=0)return'today';
  const days=diff/86400000;
  if(days<1)return'today';
  if(days<2)return'tomorrow';
  if(days<5)return'd3';
  if(days<10)return'd7';
  if(days<20)return'd14';
  return'd30';
}

function renderReviewScreen(){
  const now=Date.now();
  /* بناء البيانات لكل تاب */
  const buckets={today:[],tomorrow:[],d3:[],d7:[],d14:[],d30:[]};
  verbsEligibleForReview().forEach(verb=>{
    const vp=getVp(verb.it);
    const b=getReviewBucket(vp);
    buckets[b].push({verb,vp});
  });

  const dueCount=buckets.today.length;

  /* بناء التابز */
  const tabsHtml=REVIEW_TABS.map(t=>{
    const cnt=buckets[t.key].length;
    const isDue=t.key==='today';
    const isActive=reviewActiveTab===t.key;
    const cntBadge=cnt>0?`<span class="rtab-count">${cnt}</span>`:'';
    let cls='rtab';
    if(isActive)cls+=' active';
    if(isDue&&cnt>0)cls+=' has-due';
    return`<button class="${cls}" data-tab="${t.key}">${cntBadge}${t.label}</button>`;
  }).join('');

  /* بناء قايمة الأفعال للتاب الحالي */
  const items=buckets[reviewActiveTab]||[];
  const isToday=reviewActiveTab==='today';

  let listHtml='';
  if(items.length===0){
    listHtml=`<div class="review-empty"><div class="big">🔒</div><div>لا توجد أفعال في هذه الفترة</div></div>`;
  }else{
    listHtml=items.map(({verb,vp})=>{
      const isDue=vp.nextReview<=now;
      const lvColor=famColor(vp);
      const lvName=famLevelAr(vp.familiarityLevel);
      if(isDue){
        /* مستحق — قابل للنقر */
        let metaStr='متاح للمراجعة الآن ✓';
        return`<div class="rv-card unlocked" data-verb="${verb.it}">
          <div class="rv-icon">📖</div>
          <div class="rv-body">
            <div class="rv-verb">${verb.it}</div>
            <div class="rv-ar">${verb.ar}</div>
            <div class="rv-meta due">${metaStr}</div>
          </div>
          <div class="rv-level" style="background:${lvColor}">${lvName}</div>
        </div>`;
      }else{
        /* مقفول — اعرض الوقت */
        const diff=vp.nextReview-now;
        const hrs=Math.floor(diff/3600000);
        const mins=Math.floor((diff%3600000)/60000);
        const timeStr=hrs>0?`${hrs} ساعة`:mins>0?`${mins} دقيقة`:'قريباً';
        return`<div class="rv-card locked">
          <div class="rv-icon">🔒</div>
          <div class="rv-body">
            <div class="rv-verb">${verb.it}</div>
            <div class="rv-ar">${verb.ar}</div>
            <div class="rv-meta locked-time">يفتح بعد ${timeStr}</div>
          </div>
          <div class="rv-level" style="background:${lvColor}">${lvName}</div>
        </div>`;
      }
    }).join('');
  }

  const startBarHtml=isToday&&dueCount>0
    ?`<div class="review-start-bar"><button class="primary-btn" style="margin-bottom:0" id="rv-start-all">▶ مراجعة ${dueCount} فعل مستحق</button></div>`
    :'';

  $('screen-review').innerHTML=`
    <div class="review-header">
      <div style="font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">جدول المراجعات</div>
    </div>
    <div class="review-tabs">${tabsHtml}</div>
    <div class="review-list" id="rv-list">${listHtml}</div>
    ${startBarHtml}
  `;

  /* أحداث التابز */
  document.querySelectorAll('.rtab').forEach(btn=>{
    btn.onclick=()=>{reviewActiveTab=btn.dataset.tab;renderReviewScreen();};
  });

  /* أحداث الأفعال الفردية */
  document.querySelectorAll('.rv-card.unlocked').forEach(card=>{
    card.onclick=()=>{
      const verbIt=card.dataset.verb;
      const verb=getVerb(verbIt);
      if(!verb)return;
      const queue=buildReviewItems(verb,0);
      session={sessionIndex:-1,verb,queue,idx:0,stageDone:{},isReviewOnly:true};
      sessionStats={correct:0,wrong:0,improved:[],famChanges:{}};
      showScreen('session');
      renderQuestion();
    };
  });

  /* زرار "مراجعة كل المستحقين" */
  const rvBtn=$('rv-start-all');
  if(rvBtn)rvBtn.onclick=startReviewSession;
}

function famColor(vp){
  if(vp.familiarity>=86)return'var(--sealed)';
  if(vp.familiarity>=61)return'var(--strong)';
  if(vp.familiarity>=36)return'var(--comfortable)';
  if(vp.familiarity>=16)return'var(--familiar)';
  return'var(--seen)';
}

/* ═══════════════════════════════════════ SESSION FLOW ══════════════════════════════════ */
function startSession(){
  session=buildSession();
  if(!session){alert('أكملت كل الأفعال! 🎉');return;}
  if(!appState.inProgressSession)sessionStats={correct:0,wrong:0,improved:[],famChanges:{}};
  showScreen('session');
  renderQuestion();
}

function finishSession(){
  const vp=getVp(session.verb.it);
  /* Lesson completion (only when finishing the learn flow, not a review-only session) */
  if(!session.isReviewOnly&&vp.completedStages&&vp.completedStages.stage6&&!vp.completedLesson){
    vp.completedLesson=true;
    vp.lessonCompletedAt=Date.now();
    vp.masteryLevel=0;       /* "رأيته" — lesson done but not yet reviewed */
    vp.lastReview=Date.now();
    vp.currentInterval=MASTERY_LEVELS[0].days;
    vp.nextReview=Date.now()+MASTERY_LEVELS[0].days*86400000;
    updateFamLevel(vp);
  }
  appState.inProgressSession=null;
  saveState();

  const total=sessionStats.correct+sessionStats.wrong;
  const acc=total?Math.round(sessionStats.correct/total*100):100;

  /* الفعل القادم */
  const nextIdx=firstIncompleteIdx();
  const nextIt=nextIdx<DAILY_ORDER.length?DAILY_ORDER[nextIdx]:'—';
  const nextVerb=nextIdx<DAILY_ORDER.length?getVerb(nextIt):null;

  /* بناء قائمة التحسن */
  const famChanges=sessionStats.famChanges||{};
  const improvedChips=Object.entries(famChanges).map(([it,ch])=>{
    const delta=ch.afterLv-ch.beforeLv;
    if(delta<=0)return'';
    const vAfter=getVp(it);
    return`<div class="improved-chip">${it} +${delta} مستوى → ${famLevelAr(vAfter.familiarityLevel)}</div>`;
  }).filter(Boolean).join('');

  /* موعد المراجعة */
  const nextReviewDate=new Date(vp.nextReview).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});

  $('screen-end').innerHTML=`
    <div class="end-hero">
      <div class="end-score">${acc}%</div>
      <div class="end-label">دقة الجلسة</div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="sv" style="color:var(--green)">${sessionStats.correct}</div><div class="sl">✓ صحيح</div></div>
      <div class="stat-card"><div class="sv" style="color:var(--red)">${sessionStats.wrong}</div><div class="sl">✗ خطأ</div></div>
    </div>

    ${improvedChips?`
    <p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px">الأفعال التي تحسّنت:</p>
    <div class="improved-list">${improvedChips}</div>`:''}

    <div style="background:#f8f9fa;border-radius:14px;padding:12px 14px;margin:10px 0;">
      <p class="end-detail">📅 مراجعة <b>${session.verb.it}</b> بعد: <b>${nextReviewDate}</b></p>
      <p class="end-detail">💪 Familiarity الآن: <b>${vp.familiarity}%</b> (${famLevelAr(vp.familiarityLevel)})</p>
      ${session.isReviewOnly?`<p class="end-detail">✅ جلسة مراجعة مكتملة</p>`:(nextVerb?`<p class="end-detail">🔜 الفعل القادم: <b>${nextIt}</b> — ${nextVerb.ar}</p>`:'<p class="end-detail">🏆 أكملت جميع الأفعال!</p>')}
    </div>

    <button class="start-btn" id="btn-end-home" style="margin-top:16px">🏠 الرئيسية</button>
  `;

  showScreen('end');
  $('progress-bar').style.width='100%';
  $('btn-end-home').onclick=()=>{showScreen('home');renderHome();};
}

/* ═══════════════════════════════════════ CURRICULUM SCREEN ══════════════════════════════ */
function renderCurriculum(){
  const si=firstIncompleteIdx();
  const currentVerbIt=DAILY_ORDER[Math.min(si,DAILY_ORDER.length-1)];
  const currentVp=getVp(currentVerbIt);

  /* حالة الأزمنة للفعل الحالي */
  const tenseStatus=[
    {key:'pres',label:'المضارع',icon:'🟢',note:'مفتوح دايماً — أساس كل الأفعال'},
    {key:'past',label:'الماضي (Passato Prossimo)',icon:canUsePastFut(currentVerbIt)?'🟢':'🔒',
     note:canUsePastFut(currentVerbIt)?'مفتوح — تعلمته بعد إتقان المضارع':'يفتح بعد إتقان المضارع (مستوى Comfortable+)'},
    {key:'fut',label:'المستقبل (Futuro Semplice)',icon:canUsePastFut(currentVerbIt)?'🟢':'🔒',
     note:canUsePastFut(currentVerbIt)?'مفتوح':'يفتح مع الماضي'}
  ];

  /* خطوات تعلم الفعل */
  const stages=[
    {n:1,label:'المعنى',          desc:'MCQ ثم كتابة معنى الفعل — إيطالي↔عربي (2 MCQ + 2 كتابة + 2 كتابة)',items:6},
    {n:2,label:'النمط',           desc:'اختار التصريف الصح مع كل ضمير من الستة مع جدول النهايات',items:6},
    {n:3,label:'التصريف',         desc:'اكتب تصريف الفعل مع كل فاعل من الذاكرة — جولتان (6 فاعلين × 2)',items:12},
    {n:4,label:'النسخ + جرامر',   desc:'شايف الجملة الإيطالية بمعنى كل كلمة + شرح قاعدة الجرامر — انسخها (جولتان بكلمات مختلفة)',items:12},
    {n:5,label:'إيطالي → عربي',   desc:'شايف جملة إيطالية — اكتب معناها بالعربي (جولتان بكلمات مختلفة)',items:12},
    {n:6,label:'عربي → إيطالي',   desc:'شايف جملة بالعربي — اكتبها بالإيطالي من الذاكرة (جولتان بكلمات مختلفة)',items:12}
  ];

  /* نظام المراجعة */
  const masteryRows=MASTERY_LEVELS.map(lv=>`
    <tr>
      <td style="font-weight:700;color:var(--blue)" dir="ltr">${lv.name}</td>
      <td>${lv.nameAr}</td>
      <td dir="ltr">+${lv.days} ${lv.days===1?'يوم':'أيام'}</td>
    </tr>`).join('');

  /* الفعل الحالي — ما اتعلم وما لسه */
  const currentDone=[];
  const currentPending=[];
  for(let s=1;s<=6;s++){
    const key='stage'+s;
    const stg=stages[s-1];
    if(currentVp.completedStages[key]) currentDone.push(stg.label);
    else currentPending.push(stg.label);
  }
  const stageItems={1:6,2:6,3:12,4:12,5:12,6:12};
  const nextAction=currentPending.length>0
    ?`المرحلة ${stages.find(s=>!currentVp.completedStages['stage'+s.n])?.n} — ${currentPending[0]} (${stageItems[stages.find(s=>!currentVp.completedStages['stage'+s.n])?.n]||6} سؤال)`
    :'المراجعة الدورية حسب جدول Ebbinghaus';

  $('screen-details').innerHTML=`
    <div style="padding:14px">
      <div class="home-top" style="margin-bottom:0">
        <div class="app-title">المنهج والخطة</div>
      </div>

      <!-- الفعل الحالي -->
      <div style="background:#e3f2fd;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px">📍 أنت الآن عند: <span dir="ltr">${currentVerbIt}</span></div>
        <div style="font-size:12px;color:var(--muted)">الخطوة القادمة: <b style="color:var(--text)">${nextAction}</b></div>
        ${currentDone.length>0?`<div style="font-size:11px;color:var(--green-dk);margin-top:4px">✓ تم: ${currentDone.join(' · ')}</div>`:''}
      </div>

      <!-- خطوات تعلم الفعل -->
      <div style="background:#f8f9fa;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px">🎯 خطوات تعلم كل فعل (${stages.reduce((a,s)=>a+s.items,0)} سؤال)</div>
        ${stages.map(s=>`
          <div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
            <div style="background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-top:1px">${s.n}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:var(--text)">${s.label} <span style="color:var(--muted);font-weight:400;font-size:11px">(${s.items} أسئلة)</span></div>
              <div style="font-size:11px;color:var(--muted);margin-top:1px">${s.desc}</div>
            </div>
          </div>`).join('')}
        <div style="margin-top:8px;font-size:12px;color:var(--muted);text-align:center">بعد المرحلة 6 → الفعل يدخل نظام المراجعة الدورية</div>
      </div>

      <!-- الأزمنة -->
      <div style="background:#f8f9fa;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px">⏱ الأزمنة — حالة الفعل الحالي</div>
        ${tenseStatus.map(t=>`
          <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:16px">${t.icon}</span>
            <div>
              <div style="font-size:13px;font-weight:700">${t.label}</div>
              <div style="font-size:11px;color:var(--muted)">${t.note}</div>
            </div>
          </div>`).join('')}
      </div>

      <!-- نظام المراجعة -->
      <div style="background:#f8f9fa;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px">🔄 نظام المراجعة (Ebbinghaus)</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">كل مراجعة صح → المستوى يتقدم والانتظار يزيد. غلط → المستوى ينزل خطوة.</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px;direction:rtl;text-align:center">
          <thead><tr style="background:var(--text);color:#fff"><th style="padding:5px">Level</th><th>المستوى</th><th>الانتظار</th></tr></thead>
          <tbody>${masteryRows}</tbody>
        </table>
        <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">المراجعة = 6 أسئلة متنوعة (fill_blank / ar_to_it / it_to_ar / conj_drill) بكلمات مخصصة لكل فعل</div>
      </div>

      <!-- نظام الكلمات المخصصة -->
      <div style="background:#f3e5f5;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:800;color:#7b1fa2;margin-bottom:8px">🔗 الربط السياقي المخصص (Contextual Mapping)</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">كل فعل عنده 8 كلمات/عبارات مخصصة تجيله دايماً — الجمل منطقية 100% ومش عشوائية.</div>
        <div style="font-size:12px;color:var(--text);line-height:1.8">
          مثال — فعل <b dir="ltr">giocare</b>:<br>
          <span dir="ltr" style="color:#7b1fa2;font-weight:700">Io gioco a calcio</span> ← كرة القدم<br>
          <span dir="ltr" style="color:#7b1fa2;font-weight:700">Tu giochi con gli amici</span> ← مع الأصدقاء<br>
          <span dir="ltr" style="color:#7b1fa2;font-weight:700">Loro giocano in palestra</span> ← في الجيم
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">في Stage 4 يظهر شرح قاعدة الجرامر للكلمات اللي فيها قاعدة (أدوات، حروف جر، جمع...)</div>
      </div>

      <!-- ترتيب الأفعال -->
      <div style="background:#f8f9fa;border-radius:14px;padding:12px 14px;margin:10px 0;">
        <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:6px">📋 ترتيب الأفعال (${DAILY_ORDER.length} فعل)</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">منتظمة (-are/-ere/-ire) أولاً، ثم شبه منتظمة، ثم شاذة حسب الشيوع</div>
        <!-- Legend -->
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:10px">
          <span style="background:#4caf50;color:#fff;padding:2px 8px;border-radius:8px">✓ مكتمل</span>
          <span style="background:var(--blue);color:#fff;padding:2px 8px;border-radius:8px">◉ الحالي</span>
          <span style="background:#ff9800;color:#fff;padding:2px 8px;border-radius:8px">⚠ شاذ</span>
          <span style="background:#9c27b0;color:#fff;padding:2px 8px;border-radius:8px">~ شبه منتظم</span>
          <span style="background:#90a4ae;color:#fff;padding:2px 8px;border-radius:8px">○ لم يبدأ</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;direction:ltr">
          ${DAILY_ORDER.map((it,i)=>{
            const vp2=getVp(it);
            const done2=vp2.completedStages.stage6;
            const isCur=(i===si);
            const verb2=getVerb(it);
            const isIrreg=IRREGULAR_ALL.has(it);
            const isSemi=SEMI_REGULAR.includes(it);
            const bg=done2?'#4caf50':isCur?'var(--blue)':isIrreg?'#ff9800':isSemi?'#9c27b0':'#90a4ae';
            const endType=it.endsWith('are')?'-are':it.endsWith('ere')?'-ere':it.endsWith('ire')?'-ire':'';
            return`<span title="${verb2?verb2.ar:it} ${endType}" style="background:${bg};color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;cursor:default">${i+1}.${it}</span>`;
          }).join('')}
        </div>
        <!-- إحصائية سريعة -->
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)">
          <span>✓ مكتمل: <b style="color:var(--green-dk)">${DAILY_ORDER.filter(v=>getVp(v).completedStages.stage6).length}</b></span>
          <span>⚠ شاذة: <b style="color:#ff9800">${DAILY_ORDER.filter(v=>IRREGULAR_ALL.has(v)).length}</b></span>
          <span>~ شبه منتظمة: <b style="color:#9c27b0">${DAILY_ORDER.filter(v=>SEMI_REGULAR.includes(v)).length}</b></span>
          <span>○ منتظمة: <b>${DAILY_ORDER.filter(v=>!IRREGULAR_ALL.has(v)&&!SEMI_REGULAR.includes(v)).length}</b></span>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════ INIT ══════════════════════════════════════════ */
function init(){
  loadState();
  $('btn-home').onclick=()=>{
    if(session&&!session.isReviewOnly){
      if(confirm('الخروج من الجلسة؟')){saveState();session=null;showScreen('home');renderHome();}
    }else{
      saveState();session=null;showScreen('home');renderHome();
    }
  };
  $('btn-tts').onclick=()=>{
    appState.settings.tts=!appState.settings.tts;
    saveState();
    $('btn-tts').style.opacity=appState.settings.tts?'1':'.4';
  };
  $('main-btn').onclick=handleMainAction;
  $('btn-tts').style.opacity=appState.settings.tts?'1':'.4';
  $('footer').style.display='none';
  renderHome();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
